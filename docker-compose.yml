# NHATOM — Docker Compose (production / VPS)
#
# Chỉ chạy PostgreSQL:
#   docker compose up -d postgres
#
# Chạy full stack (DB + API + Frontend):
#   cp deploy/env.example .env
#   # Sửa .env theo domain thật
#   docker compose up -d --build
#
# ThingsBoard (thiết bị IoT) cài riêng — xem deploy/thingsboard/README.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: nhatom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nhatom}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nhatom}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhatom-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nhatom}?schema=public
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    container_name: nhatom-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  postgres_data:
  api_uploads:
