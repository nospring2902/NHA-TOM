services:
  postgres:
    image: postgres:16-alpine
    container_name: nhatom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nhatom
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nhatom']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# Gợi ý: dùng docker-compose.yml ở thư mục gốc repo cho deploy production.
